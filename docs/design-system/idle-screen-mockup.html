<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>tezOS idle screen mockup — 320x480</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  body {
    background: #444;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: sans-serif;
  }
  .device-frame {
    background: #1a1a1a;
    border-radius: 24px;
    padding: 24px 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .screen {
    width: 320px;
    height: 480px;
    background: #10143A;
    position: relative;
    overflow: hidden;
    image-rendering: pixelated;
  }
  /* subtle scanline / grid texture for CRT vibe */
  .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(15,97,255,0.05) 0px,
      rgba(15,97,255,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: #8894C4;
    border-bottom: 2px solid #0F61FF;
  }
  .status-bar .signer {
    color: #2FE6E6;
  }
  .clock-area {
    text-align: center;
    padding: 36px 0 8px;
  }
  .clock {
    font-family: 'Press Start 2P', monospace;
    font-size: 40px;
    color: #E4EAFB;
    letter-spacing: 2px;
  }
  .date {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: #8894C4;
    margin-top: 6px;
  }
  .brand {
    text-align: center;
    margin-top: 18px;
  }
  .brand .logo-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    color: #0F61FF;
    text-shadow: 0 0 0 transparent;
  }
  .ticker {
    margin-top: 26px;
    padding: 8px 14px;
    border-top: 1px solid #2A2F5A;
    border-bottom: 1px solid #2A2F5A;
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: #FF3D8A;
    white-space: nowrap;
    overflow: hidden;
  }
  .menu-preview {
    position: absolute;
    bottom: 70px;
    left: 0;
    right: 0;
    padding: 0 14px;
    font-family: 'VT323', monospace;
    font-size: 20px;
  }
  .menu-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    margin-bottom: 4px;
    color: #E4EAFB;
    border-radius: 3px;
  }
  .menu-item .num {
    color: #8894C4;
    margin-right: 10px;
  }
  .menu-item.active {
    background: #0F61FF;
    color: #10143A;
    font-weight: bold;
  }
  .menu-item.active .num {
    color: #10143A;
  }
  .softkeys {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    font-family: 'VT323', monospace;
    font-size: 20px;
    border-top: 2px solid #0F61FF;
    background: #0A0D28;
  }
  .softkeys .left { color: #2FE6E6; }
  .softkeys .right { color: #FF3D8A; }
  .caption {
    text-align: center;
    color: #ccc;
    font-family: sans-serif;
    font-size: 13px;
    margin-top: 14px;
  }
</style>
</head>
<body>
<div>
  <div class="device-frame">
    <div class="screen">
      <div class="status-bar">
        <span>WiFi ●●●</span>
        <span class="signer">SIGNER: LINKED</span>
        <span>82%</span>
      </div>
      <div class="clock-area">
        <div class="clock">14:32</div>
        <div class="date">SUN 26 JUL</div>
      </div>
      <div class="brand">
        <div class="logo-text">tezOS</div>
      </div>
      <div class="ticker">
        NEW ORIGINATION: KT1a9w...f3q2 — GRAVEYARD +1
      </div>
      <div class="menu-preview">
        <div class="menu-item active"><span class="num">1</span> Wallet</div>
        <div class="menu-item"><span class="num">2</span> Explorer</div>
        <div class="menu-item"><span class="num">3</span> Scanner</div>
        <div class="menu-item"><span class="num">4</span> Gallery</div>
      </div>
      <div class="softkeys">
        <span class="left">SELECT</span>
        <span class="right">MENU</span>
      </div>
    </div>
  </div>
  <div class="caption">tezOS idle screen — palette/type mockup, 320x480 reference</div>
</div>
</body>
</html>
